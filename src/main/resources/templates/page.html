<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${document != null ? document.title : siteConfig.title})}">
    <title>Hyde</title>
</head>
<body>
    <!-- Top Navbar -->
    <div th:replace="~{layout :: navbar}"></div>

    <!-- Mobile Offcanvas Sidebar -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" th:text="${siteConfig.title}">Navigation</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div th:replace="~{layout :: sidebarContent}"></div>
        </div>
    </div>

    <!-- Main Container Layout -->
    <div class="d-flex" style="min-height: calc(100vh - 56px);">
        <!-- Left Sidebar (Desktop) -->
        <aside class="sidebar-container d-none d-lg-block flex-shrink-0">
            <div th:replace="~{layout :: sidebarContent}"></div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-grow-1 p-4 p-md-5" style="min-width: 0;">
            <div class="row justify-content-between">
                <!-- Article Body Column -->
                <div th:class="${document != null and document.tableOfContents != null and !document.tableOfContents.isEmpty()} ? 'col-xl-9 col-lg-8 col-12' : 'col-12'">

                        <!-- Breadcrumbs -->
                        <nav aria-label="breadcrumb" class="mb-3">
                            <ol class="breadcrumb small">
                                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                                <li th:if="${document != null and document.isPost}" class="breadcrumb-item"><a th:href="@{/posts}">Posts</a></li>
                                <li th:if="${document != null and document.relativePath != null and document.relativePath.contains('/') and !document.isPost}"
                                    class="breadcrumb-item text-capitalize"
                                    th:text="${#strings.substringBefore(document.relativePath, '/')}">Category</li>
                                <li class="breadcrumb-item active text-truncate" style="max-width: 250px;" th:text="${document != null ? document.title : 'Page'}">Title</li>
                            </ol>
                        </nav>

                        <!-- Document Header -->
                        <header th:if="${document != null}" class="mb-4 pb-3 border-bottom">
                            <h1 class="display-6 fw-bold mb-3" th:text="${document.title}">Document Title</h1>

                            <div class="d-flex flex-wrap align-items-center gap-3 text-muted small">
                                <!-- Date -->
                                <span th:if="${document.postDate != null}">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:text="${document.postDate}">2024-01-15</span>
                                </span>

                                <!-- Author -->
                                <span th:if="${document.frontMatter.author != null}">
                                    <i class="bi bi-person me-1"></i>
                                    <span th:text="${document.frontMatter.author}">Author</span>
                                </span>

                                <!-- Reading Time -->
                                <span>
                                    <i class="bi bi-stopwatch me-1"></i>
                                    <span th:text="${document.readingTimeMinutes + ' min read'}">2 min read</span>
                                </span>

                                <!-- Source File Path -->
                                <span class="d-none d-md-inline text-truncate" th:title="'Source on disk: ' + ${document.relativePath}">
                                    <i class="bi bi-file-code me-1"></i>
                                    <code class="text-muted" th:text="${document.relativePath}">_posts/...</code>
                                </span>

                                <!-- Raw Markdown Link -->
                                <a th:href="@{${document.url}(raw='true')}" target="_blank" class="btn btn-xs btn-outline-secondary py-0 px-2 ms-auto" style="font-size: 0.78rem;">
                                    <i class="bi bi-file-text me-1"></i>Raw Markdown
                                </a>
                            </div>

                            <!-- Tags and Categories -->
                            <div class="d-flex flex-wrap gap-1 mt-3" th:if="${(document.frontMatter.tags != null and !document.frontMatter.tags.isEmpty()) or (document.frontMatter.categories != null and !document.frontMatter.categories.isEmpty())}">
                                <a th:each="cat : ${document.frontMatter.categories}"
                                   th:href="@{'/categories/' + ${cat}}"
                                   class="badge text-decoration-none bg-primary-subtle text-primary-emphasis border border-primary-subtle">
                                    <i class="bi bi-folder me-1"></i><span th:text="${cat}">Category</span>
                                </a>
                                <a th:each="tag : ${document.frontMatter.tags}"
                                   th:href="@{'/tags/' + ${tag}}"
                                   class="badge text-decoration-none bg-secondary-subtle text-secondary-emphasis border">
                                    <i class="bi bi-tag me-1"></i><span th:text="${tag}">tag</span>
                                </a>
                            </div>
                        </header>

                        <!-- Rendered HTML Content -->
                        <article class="markdown-body" th:if="${document != null}" th:utext="${document.renderedHtml}">
                            Markdown content goes here...
                        </article>

                        <!-- Home Page Recent Posts Section -->
                        <section th:if="${isHome != null and isHome and allPosts != null and !allPosts.isEmpty()}" class="mt-5 pt-4 border-top">
                            <div class="d-flex align-items-center justify-content-between mb-4">
                                <h2 class="h3 fw-bold mb-0"><i class="bi bi-journal-richtext me-2 text-primary"></i>Recent Posts</h2>
                                <a th:href="@{/posts}" class="btn btn-sm btn-outline-primary">View All Posts &rarr;</a>
                            </div>

                            <div class="row g-4">
                                <div th:each="post : ${allPosts}" class="col-md-6 col-12">
                                    <div class="card h-100 shadow-sm border">
                                        <div class="card-body d-flex flex-column">
                                            <div class="d-flex align-items-center gap-2 text-muted small mb-2">
                                                <span th:if="${post.postDate != null}">
                                                    <i class="bi bi-calendar-event me-1"></i><span th:text="${post.postDate}">2024-01-01</span>
                                                </span>
                                                <span>&bull;</span>
                                                <span th:text="${post.readingTimeMinutes + ' min read'}">1 min</span>
                                            </div>
                                            <h5 class="card-title fw-bold">
                                                <a th:href="@{${post.url}}" class="text-decoration-none text-body" th:text="${post.title}">Post Title</a>
                                            </h5>
                                            <p class="card-text text-secondary small flex-grow-1" th:text="${post.excerpt}">
                                                Post excerpt summary...
                                            </p>
                                            <div class="d-flex flex-wrap gap-1 mt-2" th:if="${post.frontMatter.tags != null}">
                                                <a th:each="tag : ${post.frontMatter.tags}" th:href="@{'/tags/' + ${tag}}" class="badge text-decoration-none bg-secondary-subtle text-secondary-emphasis">
                                                    <span th:text="'#' + ${tag}">tag</span>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                    </div>

                    <!-- Right Sticky Table of Contents Column -->
                    <div th:if="${document != null and document.tableOfContents != null and !document.tableOfContents.isEmpty()}" class="col-xl-3 col-lg-4 d-none d-lg-block">
                        <div class="toc-sidebar ps-3 border-start">
                            <div class="fw-bold text-uppercase small text-muted mb-2"><i class="bi bi-list-nested me-1"></i>On This Page</div>
                            <nav class="nav flex-column">
                                <a th:each="item : ${document.tableOfContents}"
                                   th:href="'#' + ${item.anchor}"
                                   th:class="'toc-link toc-level-' + ${item.level}"
                                   th:text="${item.text}">
                                    Heading Title
                                </a>
                            </nav>
                        </div>
                    </div>
                </div>
            </main>
        </div>

    <!-- Footer -->
    <div th:replace="~{layout :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
