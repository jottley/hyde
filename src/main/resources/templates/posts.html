<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${pageTitle != null ? pageTitle : 'Posts'})}">
    <title>Posts</title>
</head>
<body>
    <!-- Top Navbar -->
    <div th:replace="~{layout :: navbar}"></div>

    <!-- Mobile Offcanvas Sidebar -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" th:text="${siteConfig.title}">Navigation</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div th:replace="~{layout :: sidebarContent}"></div>
        </div>
    </div>

    <!-- Main Container Layout -->
    <div class="d-flex" style="min-height: calc(100vh - 56px);">
        <!-- Left Sidebar -->
        <aside class="sidebar-container d-none d-lg-block flex-shrink-0">
            <div th:replace="~{layout :: sidebarContent}"></div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-grow-1 p-4 p-md-5" style="min-width: 0;">
                <div class="max-w-4xl">
                    <!-- Page Header -->
                    <div class="mb-4 pb-3 border-bottom d-flex flex-wrap align-items-center justify-content-between gap-3">
                        <div>
                            <h1 class="display-6 fw-bold mb-1" th:text="${pageTitle != null ? pageTitle : 'Articles & Posts'}">Posts</h1>
                            <p class="text-muted mb-0" th:text="${pageSubtitle != null ? pageSubtitle : 'Browse markdown articles and blog posts'}">Articles</p>
                        </div>
                        <div th:if="${selectedTag != null or selectedCategory != null}">
                            <a th:href="@{/posts}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Clear Filter
                            </a>
                        </div>
                    </div>

                    <!-- Post List -->
                    <div th:if="${posts != null and !posts.isEmpty()}" class="d-flex flex-column gap-4">
                        <article th:each="post : ${posts}" class="card border shadow-sm">
                            <div class="card-body p-4">
                                <div class="d-flex flex-wrap align-items-center gap-2 text-muted small mb-2">
                                    <span th:if="${post.postDate != null}">
                                        <i class="bi bi-calendar-event me-1"></i>
                                        <span th:text="${post.postDate}">2024-01-15</span>
                                    </span>
                                    <span th:if="${post.frontMatter.author != null}">
                                        &bull; <i class="bi bi-person me-1"></i>
                                        <span th:text="${post.frontMatter.author}">Author</span>
                                    </span>
                                    <span>&bull;</span>
                                    <span th:text="${post.readingTimeMinutes + ' min read'}">2 min read</span>
                                </div>

                                <h2 class="h4 card-title fw-bold mb-2">
                                    <a th:href="@{${post.url}}" class="text-decoration-none text-body" th:text="${post.title}">Post Title</a>
                                </h2>

                                <p class="card-text text-secondary mb-3" th:text="${post.excerpt}">
                                    Post excerpt summary...
                                </p>

                                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 pt-2 border-top">
                                    <div class="d-flex flex-wrap gap-1">
                                        <a th:each="cat : ${post.frontMatter.categories}" th:href="@{'/categories/' + ${cat}}" class="badge text-decoration-none bg-primary-subtle text-primary-emphasis">
                                            <i class="bi bi-folder me-1"></i><span th:text="${cat}">cat</span>
                                        </a>
                                        <a th:each="tag : ${post.frontMatter.tags}" th:href="@{'/tags/' + ${tag}}" class="badge text-decoration-none bg-secondary-subtle text-secondary-emphasis">
                                            <span th:text="'#' + ${tag}">tag</span>
                                        </a>
                                    </div>
                                    <a th:href="@{${post.url}}" class="btn btn-sm btn-link text-decoration-none p-0">
                                        Read Article <i class="bi bi-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </article>
                    </div>

                    <!-- Empty State -->
                    <div th:if="${posts == null or posts.isEmpty()}" class="alert alert-info py-4 text-center">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        <h5>No Posts Found</h5>
                        <p class="text-muted mb-3">No markdown documents matched your filter.</p>
                        <a th:href="@{/posts}" class="btn btn-sm btn-primary">View All Posts</a>
                    </div>
                </div>
            </main>
        </div>

    <!-- Footer -->
    <div th:replace="~{layout :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
